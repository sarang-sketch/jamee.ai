# =============================================================================
# Jamee — CI release gates (Requirement 17.8, task 28.6)
# =============================================================================
#
# WHAT THIS GATES. Requirement 17.8 makes "compiles under TypeScript strict mode with no type
# errors" a release gate, and the design says it is "enforced in CI". Task 28.6 names the full
# gate set: `tsc --noEmit`, the unit/property/integration suites, `scripts/check-secret-scope.ts`,
# `scripts/check-shared-implementation.ts`, and the accessibility scan.
#
# WHEN IT RUNS. Every `push` to any branch and every `pull_request`. Plus `workflow_dispatch` so a
# release can be gated on demand without a commit.
#
# HOW IT BLOCKS — READ THIS. A failing workflow run reports failure, but GitHub does not refuse a
# merge on that alone. Making these gates actually block requires a branch protection rule (or
# ruleset) on the default branch listing BOTH job names below as required status checks:
#
#     Static, unit and property gates
#     Integration suite (real Supabase stack)
#
# That is a repository setting, not something a workflow file can assert. Until it is enabled,
# these are advisory checks, not gates. Whoever sets up the repository owns that step.
#
# NODE VERSION. `package.json` engines is `^22.12.0 || >=24.0.0`. CI pins the 24 line, because:
#   - it satisfies the `>=24.0.0` half of engines and matches the development machine;
#   - `scripts/check-*.ts` run under `node --experimental-strip-types`, which is REQUIRED on 22.12
#     and an accepted no-op on 24, so a 24 run exercises the flag-free semantics the scripts will
#     have long-term while the same command line still works on 22;
#   - Node 24 is what `supabase/setup-cli` installs when a runner has no Node, so the integration
#     job stays on one runtime.
# GAP, stated rather than hidden: the LOWER bound of engines (22.12) is NOT exercised here. A
# regression that only appears on Node 22 would pass this workflow. Widening to a 22/24 matrix is
# the fix if the project decides to keep supporting 22; it doubles the run and buys nothing for the
# release itself, since the release runs on one runtime.
#
# SECRETS. None. `npm run build` was verified to succeed with ZERO environment configured — every
# page and route handler is dynamic and `src/lib/env.ts` validates on first use, so nothing reads a
# variable at build time. No placeholder credentials are set anywhere in this file. The only keys
# that appear at all are the Supabase CLI's fixed local-stack demo keys, which are identical on
# every machine and are not credentials.
#
# DELIBERATELY NOT A GATE — `npm run check:deployment`. Task 28.4 built it and recommended against
# including it here, and that recommendation stands: it asserts facts about a LIVE deployment (a
# real Supabase project, a deployed HTTPS origin, `psql`, and `CRON_SECRET`) and exits 1 on an
# unconfigured machine by design. Wiring it here would either fail every run or require real
# project credentials in CI. Its home is `docs/DEPLOYMENT.md` steps 3 and 7, run by an operator
# against the deployment it describes.
#
# THE ACCESSIBILITY SCAN IS GATED BY THE "Unit suite" STEP. Task 26.3 landed it as
# `tests/unit/accessibility.test.tsx`, which runs in the vitest `unit` project — so `npm run
# test:unit` above is what fails a build on an accessibility violation, and no separate step is
# needed. The detect-and-warn step that used to stand in for it now reports which engine is
# installed instead of warning about a missing one.
#
# What that step CANNOT report, and what no CI job can: an automated scan is not WCAG conformance.
# The scan itself prints its own limits on every run (contrast is not evaluated under jsdom, the
# diagnosis detail screen is not scanned, and full conformance still needs the manual screen-reader
# pass tracked in task 30.1). Read that output rather than the tick.
#
# ACTION PINS. GitHub-authored actions are pinned to a major tag, which is the version GitHub itself
# documents and which picks up security patches without an edit. The Supabase CLI is pinned to an
# exact version — see the comment on that step.

name: Release gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A superseded push does not need its gates finished.
concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # See NODE VERSION above. Major-only so patch updates arrive without a workflow edit.
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — everything that needs no external service.
  #
  # Ordered cheapest-signal-first: the two static guards and the type check fail in seconds and
  # cover Requirement 17.8 directly, so a broken build is reported before the test suites run.
  # ---------------------------------------------------------------------------
  gates:
    name: Static, unit and property gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # Requirement 17.8, stated literally. This is THE release gate the requirement names, which
      # is why it runs first.
      - name: Type check — tsc --noEmit under strict mode
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Requirements 13.7 / 13.4 and the service-role anchoring rules.
      #
      # This guard and the type check are coupled: `check:secret-scope` reports insert payloads
      # passed as a parameter as UNPROVEN and defers their `user_id` to the type system, so the
      # guard's own output says `npm run typecheck` is what proves those rows carry a tenant. Both
      # must be gates or neither proves anything. They are.
      - name: Guard — secret scope and service-role anchoring
        run: npm run check:secret-scope

      # Requirements 3.8, 7.7, 16.1–16.4. The single-implementation claims are structural, so the
      # design verifies them with this static check rather than a property test.
      - name: Guard — single shared implementation and layering
        run: npm run check:shared-implementation

      - name: Unit suite
        run: npm run test:unit

      - name: Property suite
        run: npm run test:property

      # Last because it is the slowest and everything above is a stricter signal. It also re-runs
      # the type check inside `next build`, which is a free cross-check of the gate above.
      - name: Production build
        run: npm run build

      # -----------------------------------------------------------------------
      # The accessibility scan named in task 28.6 EXISTS, and the "Unit suite" step above is what
      # gates it.
      #
      # Task 26.3 landed it as `tests/unit/accessibility.test.tsx`, inside the vitest `unit`
      # project: an axe violation on any scanned screen fails that step. So this step still wires
      # no scan of its own — running one here would be a second implementation of 26.3's job.
      #
      # What it does instead is assert the two facts whose absence would make that gate disappear
      # with nothing in this workflow turning red:
      #
      #   1. an accessibility engine is still a declared dependency, and
      #   2. the scan file is still where the unit project's glob picks it up.
      #
      # Both are failures rather than warnings now. This was a warn-only step for as long as there
      # was nothing to check; a scan that has been deleted is a lost gate, not a note.
      #
      # It cannot assert conformance, and neither can any other job here. The scan prints its own
      # limits on every run — no contrast evaluation under jsdom, the diagnosis detail screen
      # unscanned, and the manual screen-reader pass in task 30.1 still outstanding.
      # -----------------------------------------------------------------------
      - name: Assert the accessibility scan is present and gated
        run: |
          set -euo pipefail

          if ! grep -Eq '"(axe-core|jest-axe|vitest-axe|@axe-core/[a-z0-9-]+|pa11y|pa11y-ci)"[[:space:]]*:' package.json; then
            echo "::error title=No accessibility engine::Task 26.3's scan needs one and package.json declares none, so the 'Unit suite' step cannot be gating accessibility. Restore the dependency or, if the scan was removed deliberately, say so here instead of leaving a green run that looks like coverage."
            exit 1
          fi

          if [ ! -f tests/unit/accessibility.test.tsx ]; then
            echo "::error title=Accessibility scan is missing::tests/unit/accessibility.test.tsx is gone. The vitest unit project glob is what gates the scan, and an absent file is a silently passing suite rather than a failing one."
            exit 1
          fi

          echo "::notice title=Accessibility scan is gated by the unit suite::tests/unit/accessibility.test.tsx runs axe-core over the sign-in, diagnose, chat, voice and history screens in all three languages, and fails the 'Unit suite' step on a violation. It is NOT WCAG conformance: contrast is not evaluated under jsdom, the diagnosis detail screen is not scanned, and full conformance still requires the manual screen-reader pass tracked in task 30.1, which no CI job can perform."

      - name: Record what this run did and did not gate
        if: always()
        run: |
          {
            echo '## Jamee release gates'
            echo
            echo "Node \`${NODE_VERSION}\` · no environment configured · no secrets used"
            echo
            echo '### Gated here'
            echo '- `tsc --noEmit` (strict) — Requirement 17.8'
            echo '- `eslint .`'
            echo '- `check:secret-scope` — Requirements 13.4, 13.7'
            echo '- `check:shared-implementation` — Requirements 3.8, 7.7, 16.1–16.4'
            echo '- unit suite · property suite'
            echo '- **accessibility scan** — `tests/unit/accessibility.test.tsx`, inside the unit suite (task 26.3)'
            echo '- `next build`'
            echo
            echo '### Gated in the second job'
            echo '- integration suite, against a real Supabase stack, with an assertion that it actually executed'
            echo
            echo '### NOT gated, and why'
            echo '- **WCAG conformance** — the scan above is automated only: no contrast evaluation under jsdom, the diagnosis detail screen unscanned, and no screen reader involved'
            echo '- **`check:deployment`** — needs a live deployment and real credentials; belongs to `docs/DEPLOYMENT.md` steps 3 and 7'
            echo '- **Node 22.12** — the lower bound of `engines`; CI runs the 24 line only'
            echo '- **manual validation** — SMS OTP delivery, hi/mr transcription quality, WhatsApp from a handset, screen-reader pass (`docs/TESTING_REPORT.md`)'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2 — the integration suite, against a real stack.
  #
  # WHY A SEPARATE JOB. The suite needs Postgres, Auth, PostgREST and Storage all running.
  # `tests/integration/database.ts` is explicit that a bare Postgres is not enough: RLS is
  # evaluated against `auth.uid()`, which only exists when a request carries a session JWT the Auth
  # service minted. So a `services: postgres:...` container could not run this suite — it takes the
  # local Supabase stack, which means Docker, which means its own job.
  #
  # WHY `needs: gates`. Spinning the stack up costs minutes of image pulls. There is no value in
  # paying that for a tree that does not type check.
  #
  # WHY IT IS NOT ALLOWED TO SELF-SKIP. `npm test` runs three projects and the integration project
  # reports as SKIPPED when `JAMEE_TEST_DATABASE_URL` is absent — by design, so a developer with no
  # database still gets a green run. That design is right locally and wrong in CI: a skipped suite
  # would show a green tick that means "did not run". Two things prevent it here. The job sets the
  # variable from the stack it just started, and the final step reads the run's JSON report and
  # FAILS when zero tests executed. A broken stack setup therefore fails loudly instead of passing
  # as coverage.
  #
  # HONEST STATUS OF THIS JOB. It was authored but never executed — the authoring machine has no
  # Docker, so no GitHub Actions run has confirmed it. Every step follows the sequence
  # `tests/integration/database.ts` documents for a local stack. The likeliest first-run
  # adjustment is the `supabase init`-generated `supabase/config.toml`: `tests/integration/
  # farmers.ts` notes that some stacks refuse a phone on the admin create endpoint until the phone
  # provider is enabled under `[auth.sms]`. If that surfaces, the fix belongs with task 29.1, which
  # owns the harness and its documented setup. The zero-tests assertion below is what guarantees a
  # setup problem shows up as a red job rather than a false green.
  #
  # WHAT IT COVERS TODAY. Nine files, 104 tests. `harness.test.ts` (task 29.1 — RLS tenant
  # isolation, the five seeded conditions, the profile trigger), `release-acceptance.test.ts`
  # (task 31.1), and the four per-channel scenario suites tasks 29.2 to 29.5 added —
  # `image-scenarios`, `chat-scenarios`, `voice-scenarios`, `whatsapp-scenarios` — so the
  # requirements' scenario matrix is now gated here rather than pending. They needed no workflow
  # edit: the project glob already includes `tests/integration/**`, which was the point of wiring
  # this job before they landed.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration suite (real Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # Pinned rather than `latest`. The CLI pins the container image tags it starts, so a fixed CLI
      # version means a fixed stack — which is what a gate needs. Bump it deliberately.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # The repository ships `supabase/migrations` but no `supabase/config.toml` —
      # `tests/integration/database.ts` records that as deliberate and has each clone run
      # `supabase init`. This mirrors that rather than committing a config file, and steps aside if
      # a config is ever committed, so it never overwrites a real one.
      - name: Initialize the Supabase project config
        run: |
          set -euo pipefail
          if [ -f supabase/config.toml ]; then
            echo "supabase/config.toml is committed — using it as is."
          else
            supabase init
          fi

      # `supabase start` applies `supabase/migrations` in order on a fresh container, including
      # 0009's buckets and 0010's five seed rows — exactly the state the harness asserts. The local
      # instructions also run `supabase db reset`; on a throwaway runner the container is already
      # new, so that second pass would recreate it to reach the state `start` just produced.
      - name: Start the local Supabase stack
        run: supabase start

      # `supabase status -o env` prints shell assignments: API_URL, DB_URL, ANON_KEY,
      # SERVICE_ROLE_KEY and friends. It is sourced from the runner temp directory rather than the
      # working tree, and never echoed.
      #
      # The variable NAMES on the right are the application's own, which is what
      # `tests/integration/database.ts` reads — no test-only aliases, so the harness resolves its
      # clients the way production does.
      #
      # These keys are the CLI's fixed local-stack values, byte-identical on every machine that
      # runs `supabase start`. They are scaffolding, not credentials.
      - name: Export the stack's connection details
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/supabase-env.sh"
          supabase status -o env > "${env_file}"

          set -a
          # shellcheck disable=SC1090
          . "${env_file}"
          set +a

          missing=''
          [ -n "${DB_URL:-}" ]            || missing="${missing} DB_URL"
          [ -n "${API_URL:-}" ]           || missing="${missing} API_URL"
          [ -n "${ANON_KEY:-}" ]          || missing="${missing} ANON_KEY"
          [ -n "${SERVICE_ROLE_KEY:-}" ]  || missing="${missing} SERVICE_ROLE_KEY"

          if [ -n "${missing}" ]; then
            echo "::error title=Stack details missing::supabase status -o env produced no value for:${missing}. Without these the integration suite would self-skip and report green, so this fails now instead."
            exit 1
          fi

          {
            echo "JAMEE_TEST_DATABASE_URL=${DB_URL}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

          rm -f "${env_file}"
          echo "Exported the database URL, API URL, anon key and service-role key."

      # `default` keeps the log readable; `json` produces the report the next step audits.
      - name: Integration suite
        run: |
          npm run test:integration -- \
            --reporter=default \
            --reporter=json \
            --outputFile.json="${RUNNER_TEMP}/integration-report.json"

      # The gate on the gate. A vitest run in which every test was skipped exits 0, so without this
      # a stack that came up wrong would look like passing integration coverage. `if: always()` so
      # the audit still reports when the suite itself failed.
      - name: Assert the integration suite actually executed
        if: always()
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync, existsSync } = require("node:fs");
            const path = process.argv[1];

            if (!existsSync(path)) {
              console.error("::error title=No integration report::The suite produced no JSON report, so whether it ran cannot be established. Treating that as a failed gate.");
              process.exit(1);
            }

            const report = JSON.parse(readFileSync(path, "utf8"));
            const passed = report.numPassedTests ?? 0;
            const failed = report.numFailedTests ?? 0;
            const skipped = report.numPendingTests ?? 0;
            console.log(`integration: ${passed} passed, ${failed} failed, ${skipped} skipped`);

            if (failed > 0) {
              console.error(`::error title=Integration tests failed::${failed} test(s) failed.`);
              process.exit(1);
            }

            if (passed === 0) {
              console.error("::error title=Integration suite did not run::Zero tests executed. The integration project self-skips when JAMEE_TEST_DATABASE_URL is unset, so this is a broken gate rather than passing coverage. Check the stack startup and the export step above.");
              process.exit(1);
            }

            if (skipped > 0) {
              console.log(`::warning title=Skipped integration tests::${skipped} test(s) were skipped and are not covered by this run.`);
            }
          ' "${RUNNER_TEMP}/integration-report.json"
